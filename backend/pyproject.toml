[project]
name = "cad-to-urdf-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pythonocc-core==7.8.1",
    "trimesh>=4.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pyyaml>=6.0"]

[tool.pytest.ini_options]
# library-internal: fastapi.testclient imports starlette.testclient, which warns about httpx
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
